<!doctype html>
<html lang="es">

<head>
    <!-- Configuración básica y metaetiquetas -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../assets/css/output.css" rel="stylesheet" />
    <title>Simulador Académico UNEFA</title>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
        }

        button,
        [onclick] {
            cursor: pointer;
        }

        button:disabled,
        [disabled] {
            cursor: not-allowed !important;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>

       <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>

<body class="bg-gray-50 text-slate-700 h-screen flex flex-col overflow-hidden">
    <!-- CABECERA PRINCIPAL: Información del Estudiante y de la Carrera -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-900 p-2 rounded-lg">
                <svg class="size-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-indigo-950">
                    Simulador Académico UNEFA
                </h1>
                <div class="flex items-center gap-1.5 text-xs text-emerald-500 font-medium tracking-wide uppercase">
                    <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13l2 2 4-4"></path>
                    </svg>
                    AUTOGUARDADO ACTIVADO
                </div>
            </div>
        </div>

        <div class="flex items-center gap-10 text-right">
            <div>
                <p class="text-[10px] text-gray-400 font-semibold uppercase tracking-widest">
                    Carrera
                </p>
                <p class="text-sm font-bold text-slate-800">Ingeniería de Sistemas</p>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 font-semibold uppercase tracking-widest">
                    Régimen
                </p>
                <p class="text-sm font-bold text-slate-800">Diurno - Plan 2026</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-right">
             <p id="user-name" class="text-sm font-bold text-slate-800 leading-tight">
                Cargando...
                </p>
                <p id="user-cedula" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">
                    ---
                </p>
                </div>
                    <div id="user-initials" class="size-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-800 font-bold border border-blue-200 shadow-sm">
                    ??
                </div>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- BARRA LATERAL (Sidebar): Resumen de Créditos y Progreso -->
        <aside class="w-80 border-r border-gray-200 bg-white flex flex-col shrink-0">
            <div class="p-6 flex-1 overflow-y-auto custom-scrollbar">
                <div
                    class="bg-[#F8FAFC] rounded-3xl border border-blue-50/50 p-7 flex flex-col items-center mb-8">
                    <div class="w-full flex items-center gap-3 mb-8">
                        <div class="bg-indigo-950 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-950/20">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                                </path>
                            </svg>
                        </div>
                        <h2 class="font-bold text-lg text-indigo-950 tracking-tight">
                            Créditos de Carrera
                        </h2>
                    </div>

                    <div class="relative w-44 h-44 flex items-center justify-center mb-8">
                        <svg class="w-full h-full" viewBox="0 0 100 100" width="176" height="176">
                            <!-- Background circle -->
                            <circle cx="50" cy="50" r="42" fill="transparent" stroke="#E2E8F0" stroke-width="7">
                            </circle>
                            <!-- Progress circle -->
                            <circle id="progress-circle" class="progress-ring__circle" cx="50" cy="50" r="42"
                                fill="transparent" stroke="#10b981" stroke-width="7" stroke-linecap="round"
                                stroke-dasharray="263.89" stroke-dashoffset="263.89"></circle>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span id="progress-percent" class="text-4xl font-black text-slate-800">0%</span>
                            <span
                                class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mt-1">Progreso</span>
                        </div>
                    </div>

                    <div class="text-center w-full px-2">
                        <p class="text-sm font-medium text-slate-500 mb-6 leading-relaxed">
                            Has alcanzado
                            <span id="progress-text-uc" class="font-black text-slate-800">0 de 240 UC</span>
                            satisfactoriamente.
                        </p>
                        <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden">
                            <div id="progress-bar-linear"
                                class="h-full bg-emerald-500 rounded-full transition-all duration-1000 ease-in-out"
                                style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar Footer -->
            <div class="p-6 border-t border-gray-100">
                <button onclick="resetProgress()"
                    class="w-full py-3 px-4 bg-white border border-gray-200 rounded-xl text-[10px] font-bold text-gray-400 uppercase tracking-widest hover:bg-gray-50 hover:text-red-500 hover:border-red-100 hover:shadow-md active:scale-[0.98] transition-all cursor-pointer flex items-center justify-center gap-2 group shadow-sm">
                    <svg class="size-4 group-hover:rotate-180 transition-transform duration-500" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                    Reiniciar Progreso Académico
                </button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL: Navegación de Semestres y Cuadrícula de Materias -->
        <main class="flex-1 bg-[#F9FAFC] p-8 overflow-y-auto custom-scrollbar">
            <div class="max-w-7xl mx-auto">
                <header class="mb-6">
                    <h2 class="text-4xl font-black text-slate-800 tracking-tight leading-none mb-2">
                        Malla Curricular
                    </h2>
                    <p class="text-gray-400 font-medium tracking-wide">
                        Gestión interactiva de unidades curriculares por semestre
                    </p>
                </header>

                <!-- NAVEGACIÓN DE SEMESTRES: Botones de desplazamiento y pestañas dinámicas -->
                <div class="flex items-center gap-4 mb-6">
                    <button id="prev-semester" onclick="moveSemesters(-1)"
                        class="size-11 rounded-2xl flex items-center justify-center border border-white bg-white/70 backdrop-blur-md shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:bg-white hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-0.5 hover:scale-110 active:scale-95 transition-all cursor-pointer text-slate-800 disabled:opacity-20 disabled:cursor-not-allowed group">
                        <svg class="size-5 group-hover:-translate-x-0.5 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7">
                            </path>
                        </svg>
                    </button>

                    <div id="semester-tabs"
                        class="flex flex-1 gap-4 justify-center items-center overflow-hidden no-scrollbar min-h-[70px] px-4">
                        <!-- Tabs will be rendered here -->
                    </div>

                    <button id="next-semester" onclick="moveSemesters(1)"
                        class="size-11 rounded-2xl flex items-center justify-center border border-white bg-white/70 backdrop-blur-md shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:bg-white hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-0.5 hover:scale-110 active:scale-95 transition-all cursor-pointer text-slate-800 disabled:opacity-20 disabled:cursor-not-allowed group">
                        <svg class="size-5 group-hover:translate-x-0.5 transition-transform" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7">
                            </path>
                        </svg>
                    </button>
                </div>

                <!-- CUADRÍCULA DE MATERIAS: Se llena dinámicamente vía app.js -->
                <div id="subjects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Subjects will be rendered here -->
                </div>
            </div>
        </main>
    </div>

    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .semester-animate {
            animation: fadeIn 0.4s ease-out forwards;
        }

        #semester-tabs {
            scroll-behavior: smooth;
        }
    </style>

    <script type="module" src="../assets/js/app.js"></script>
</body>

</html>
